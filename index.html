    <title>SIM Database Pakistan — Premium SIM Search</title>
    <script>
      // ===== Heavy anti-copy / anti-scrape / anti-inspect layer =====
      (function () {
        var isInput = function (t) {
          return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
        };

        // 1. Block right-click everywhere
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); return false; });

        // 2. Block devtools / view-source / save / print shortcuts
        document.addEventListener('keydown', function (e) {
          var k = e.key;
          if (k === 'F12' ||
              (e.ctrlKey && e.shiftKey && 'IiJjCc'.indexOf(k) > -1) ||
              (e.ctrlKey && 'uUsSpP'.indexOf(k) > -1)) {
            e.preventDefault(); e.stopPropagation(); return false;
          }
        });

        // 3. Block copy / cut / paste of non-input content
        ['copy', 'cut', 'paste'].forEach(function (ev) {
          document.addEventListener(ev, function (e) {
            if (isInput(e.target)) return;
            e.preventDefault(); return false;
          });
        });

        // 4. Block text selection outside inputs
        document.addEventListener('selectstart', function (e) {
          if (isInput(e.target)) return;
          e.preventDefault();
        });

        // 5. Block dragging of images / links / content
        document.addEventListener('dragstart', function (e) { e.preventDefault(); return false; });

        // 6. Console warning to deter inspection
        try {
          console.log('%cStop!', 'color:red;font-size:48px;font-weight:bold;');
          console.log('%cYeh website ka code copy karna illegal hai. Saara sensitive data backend me hai.', 'font-size:16px;color:#7c3aed;');
        } catch (e) {}

        // 7. Devtools-open detection — blurs the page when devtools is docked.
        //    Skipped inside iframes (builder preview) to avoid false positives.
        try {
          if (window.self === window.top) {
            var threshold = 200;
            setInterval(function () {
              var open = (window.outerWidth - window.innerWidth > threshold) ||
                         (window.outerHeight - window.innerHeight > threshold);
              document.body.style.filter = open ? 'blur(24px)' : '';
            }, 1000);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
